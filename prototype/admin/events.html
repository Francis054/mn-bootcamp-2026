<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events · Admin · 2026 Cyber Bootcamp · Maxim Nyansa Foundation</title>
<meta name="description" content="Design prototype for the Maxim Nyansa Foundation 2026 Cybersecurity Bootcamp community website.">
<meta name="theme-color" content="#0E2A1E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2388CC00'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.4-8 10.4C11.4 23.4 8 20 8 15V9z' fill='none' stroke='%230E2A1E' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/admin.css">
</head>
<body data-root="../" data-page="" class="admin " data-admin="events" data-crumbs="Events">
<a class="skip-link" href="#main">Skip to content</a>
<div class="admin-shell"><aside id="admin-sidebar"></aside><div class="admin-body"><header id="admin-topbar"></header>
<main id="main" class="admin-main"><div class="a-head"><div><h1>Events</h1><p>Verified events come from published Foundation and partner sources.</p></div><div class="a-head__actions"><button class="btn btn--ghost btn--sm" type="button" onclick="MN.toast('Export is simulated','A CSV would download here')"><svg class="i i--sm"><use href="#i-download"/></svg>Export</button><a class="btn btn--dark btn--sm" href="event-edit.html?new=1"><svg class="i i--sm"><use href="#i-plus"/></svg>New</a></div></div>
<section class="panel">
  <div class="a-toolbar"><div class="input-icon"><svg class="i i--sm"><use href="#i-search"/></svg><input class="input" type="search" id="q" placeholder="Search events…" aria-label="Search events"></div><select class="select" id="f-ki" aria-label="Kind"><option value="">All kinds</option><option>Anniversary</option><option>Partner event</option><option>Milestone</option></select><select class="select" id="f-ve" aria-label="Verification"><option value="">Any status</option><option value="verified">Verified</option><option value="tbc">Needs confirmation</option><option value="sample">Sample</option></select><span class="spacer"></span><span class="result-count" id="count" aria-live="polite"></span></div>
  <div class="bulkbar" id="bulk"><b><span data-n>0</span> selected</b><button class="btn btn--sm btn--xs" type="button" data-bulk-pub>Publish</button><button class="btn btn--danger btn--xs" type="button" data-bulk-del>Delete</button><button class="btn btn--ghost-light btn--xs" type="button" data-bulk-clear style="margin-left:auto">Clear</button></div>
  <div class="table-wrap"><table class="table table--cards" id="t">
<thead><tr><th class="chk"><input type="checkbox" class="all-chk" aria-label="Select all"></th><th data-sort="title">Event</th><th data-sort="date">Date</th><th>Venue</th><th>Kind</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody></tbody></table></div>
  <div class="panel__foot"><span>6 events · 1 needs confirmation</span></div>
</section>
</main></div></div>
<script src="../js/data.js"></script><script src="../js/components.js"></script><script src="../js/admin.js"></script><script>
(function(){
  const vs=e=>e.verified?'verified':e.tbc?'tbc':'sample';
  MN.A.table({el:document.getElementById('t'),data:MN.EVENTS,noun:'events',search:document.getElementById('q'),count:document.getElementById('count'),bulk:document.getElementById('bulk'),
    filters:[{el:document.getElementById('f-ki'),get:d=>d.kind},{el:document.getElementById('f-ve'),get:vs}],text:d=>d.title+' '+d.place,primary:d=>d.title,
    row:e=>`<tr data-id="${e.id}"><td class="chk"><input type="checkbox" class="row-chk" aria-label="Select ${MN.A.esc(e.title)}"></td><td class="cell-primary"><div class="cell-main"><img class="thumb" src="${MN.img(e.img,800)}" alt="" width="48" height="36" loading="lazy"><div><b><a href="event-edit.html?id=${e.id}" style="color:inherit">${e.title}</a></b><small>${e.when}</small></div></div></td><td data-label="Date" class="num">${e.tbc?'TBC':e.date}</td><td data-label="Venue">${e.place}</td><td data-label="Kind">${e.kind}</td><td data-label="Status">${MN.A.badge(vs(e))}</td><td class="cell-actions"><div class="actions"><a class="icon-btn" href="../event.html?id=${e.id}" aria-label="Preview">${MN.icon('eye','i--sm')}</a><a class="icon-btn" href="event-edit.html?id=${e.id}" aria-label="Edit ${MN.A.esc(e.title)}">${MN.icon('edit','i--sm')}</a><button class="icon-btn danger" type="button" data-del aria-label="Delete ${MN.A.esc(e.title)}">${MN.icon('trash','i--sm')}</button></div></td></tr>`});
})();
</script><script src="../js/motion.js"></script>
</body>
</html>
