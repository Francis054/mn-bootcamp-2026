<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media library · Admin · 2026 Cyber Bootcamp · Maxim Nyansa Foundation</title>
<meta name="description" content="Design prototype for the Maxim Nyansa Foundation 2026 Cybersecurity Bootcamp community website.">
<meta name="theme-color" content="#0E2A1E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2388CC00'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.4-8 10.4C11.4 23.4 8 20 8 15V9z' fill='none' stroke='%230E2A1E' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/admin.css">
</head>
<body data-root="../" data-page="" class="admin " data-admin="media" data-crumbs="Media library">
<a class="skip-link" href="#main">Skip to content</a>
<div class="admin-shell"><aside id="admin-sidebar"></aside><div class="admin-body"><header id="admin-topbar"></header>
<main id="main" class="admin-main"><div class="a-head"><div><h1>Media library</h1><p>Photos from the 10th anniversary week and partner events. People in photos are never named; consent status is tracked per image.</p></div><div class="a-head__actions"><button class="btn btn--dark btn--sm" type="button" onclick="document.getElementById('up').click()"><svg class="i i--sm"><use href="#i-upload"/></svg>Upload</button></div></div>
<label class="dropzone" id="dz" for="up"><svg class="i"><use href="#i-upload"/></svg><b>Drop images here, or browse</b><span style="color:var(--ink-3);font-size:14px">JPG, PNG or WebP · previewed in your browser only — nothing is uploaded</span><input type="file" id="up" accept="image/*" multiple class="sr-only"></label>
<ul class="upload-list" id="ul" aria-live="polite"></ul>
<div class="media-layout" style="margin-top:24px">
  <section class="panel">
    <div class="a-toolbar"><div class="input-icon"><svg class="i i--sm"><use href="#i-search"/></svg><input class="input" type="search" id="q" placeholder="Search file names and captions…" aria-label="Search media"></div><select class="select" id="cat" aria-label="Album"><option value="">All albums</option></select><span class="spacer"></span><span class="result-count" id="count" aria-live="polite"></span></div>
    <div class="bulkbar" id="bulk"><b><span id="n">0</span> selected</b><button class="btn btn--sm btn--xs" type="button" id="b-alb">Move to album</button><button class="btn btn--danger btn--xs" type="button" id="b-del">Delete</button><button class="btn btn--ghost-light btn--xs" type="button" id="b-clr" style="margin-left:auto">Clear</button></div>
    <div class="media-grid" id="grid"></div>
  </section>
  <aside class="panel media-detail" id="detail" aria-live="polite"></aside>
</div>
</main></div></div>
<script src="../js/data.js"></script><script src="../js/components.js"></script><script src="../js/admin.js"></script><script>
(function(){
  const $=id=>document.getElementById(id);
  let items=MN.PHOTOS.filter(p=>!/safari/i.test(p.f)).map((p,i)=>({...p,id:i,alt:p.cap,consent:i%4===0?'verified':'consent',src:MN.img(p.f,800)}));
  let sel=new Set(), active=items[0]&&items[0].id;
  $('cat').innerHTML+=Object.entries(MN.PHOTO_CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const vis=()=>{const t=$('q').value.toLowerCase(), c=$('cat').value; return items.filter(p=>(!c||p.cat===c)&&(!t||(p.f+' '+p.cap).toLowerCase().includes(t)));};
  const draw=()=>{ const v=vis(); $('count').textContent=`${v.length} of ${items.length}`;
    $('grid').innerHTML=v.length?v.map(p=>`<button type="button" class="media-item" data-id="${p.id}" aria-pressed="${sel.has(p.id)}" aria-label="${MN.A.esc(p.cap)}${sel.has(p.id)?', selected':''}"><img src="${p.src}" alt="" loading="lazy" width="800" height="800"><span class="mi-check">${sel.has(p.id)?MN.icon('check','i--sm'):''}</span><span class="mi-flag">${p.consent==='verified'?'':'<span class="badge badge--warning" style="font-size:10.5px">Consent TBC</span>'}</span><span class="mi-name">${p.f}.webp</span></button>`).join(''):`<div class="empty" style="grid-column:1/-1"><div class="empty__art">${MN.icon('image')}</div><h3>No images match</h3><p>Try another search or album.</p><button class="btn btn--ghost btn--sm" type="button" id="clr">Clear filters</button></div>`;
    const c=$('clr'); if(c) c.onclick=()=>{$('q').value='';$('cat').value='';draw();};
    $('n').textContent=sel.size; $('bulk').classList.toggle('is-on',sel.size>0); detail(); };
  const detail=()=>{ const p=items.find(x=>x.id===active); if(!p){$('detail').innerHTML='<div class="panel__body"><p>Select an image to see its details.</p></div>';return;}
    $('detail').innerHTML=`<div class="panel__head"><h2>Details</h2>${MN.A.badge(p.consent)}</div><div class="panel__body form-stack"><img src="${p.src}" alt="${MN.A.esc(p.alt)}" width="800" height="533"><div class="field"><label for="d-alt">Alt text *</label><textarea class="textarea" id="d-alt" maxlength="160" style="min-height:80px">${MN.A.esc(p.alt)}</textarea><span class="hint">Describe the scene. Do not name people.</span></div><div class="field"><label for="d-cat">Album</label><select class="select" id="d-cat">${Object.entries(MN.PHOTO_CATS).map(([k,v])=>`<option value="${k}"${k===p.cat?' selected':''}>${v}</option>`).join('')}</select></div><label class="check"><input type="checkbox" id="d-con"${p.consent==='verified'?' checked':''}><span>Consent confirmed for everyone pictured</span></label><dl style="font-size:13px;display:grid;gap:6px;margin:0"><div style="display:flex;justify-content:space-between;gap:8px"><dt style="color:var(--ink-3)">File</dt><dd style="font-family:var(--font-mono);margin:0;overflow-wrap:anywhere;text-align:right">${p.f}.webp</dd></div><div style="display:flex;justify-content:space-between"><dt style="color:var(--ink-3)">Size</dt><dd style="margin:0">${p.w||1600} × ${p.h||1066}</dd></div></dl><div style="display:flex;gap:8px"><button class="btn btn--dark btn--sm" type="button" id="d-save">Save</button><button class="btn btn--ghost btn--sm" type="button" id="d-del" style="color:var(--danger)">Delete</button></div></div>`;
    $('d-save').onclick=()=>{ const a=$('d-alt').value.trim(); if(!a){MN.toast('Alt text is required','Describe the image without naming anyone.','error');$('d-alt').focus();return;} p.alt=a; p.cat=$('d-cat').value; p.consent=$('d-con').checked?'verified':'consent'; draw(); MN.toast('Image details saved','Prototype — nothing was stored','success'); };
    $('d-del').onclick=()=>MN.confirm({title:'Delete this image?',text:'It will be removed from every page that uses it. Prototype only.'}).then(ok=>{if(!ok)return; items=items.filter(x=>x!==p); sel.delete(p.id); active=items[0]&&items[0].id; draw(); MN.toast('Image deleted');}); };
  $('grid').addEventListener('click',e=>{ const b=e.target.closest('.media-item'); if(!b)return; const id=+b.dataset.id; active=id; if(e.shiftKey||e.metaKey||e.ctrlKey||e.target.closest('.mi-check')||sel.size){ sel.has(id)?sel.delete(id):sel.add(id);} draw(); const nb=$('grid').querySelector(`[data-id="${id}"]`); nb&&nb.focus(); });
  $('q').addEventListener('input',draw); $('cat').addEventListener('change',draw);
  $('b-clr').onclick=()=>{sel.clear();draw();};
  $('b-alb').onclick=()=>{MN.toast(`${sel.size} image${sel.size>1?'s':''} ready to move`,'Album picker is simulated');};
  $('b-del').onclick=()=>MN.confirm({title:`Delete ${sel.size} image${sel.size>1?'s':''}?`,text:'This cannot be undone. Prototype only.'}).then(ok=>{if(!ok)return; const n=sel.size; items=items.filter(x=>!sel.has(x.id)); sel.clear(); if(!items.find(x=>x.id===active)) active=items[0]&&items[0].id; draw(); MN.toast(`${n} images deleted`);});
  // uploads
  const dz=$('dz');
  ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('is-over');}));
  ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('is-over');}));
  dz.addEventListener('drop',e=>handle(e.dataTransfer.files));
  $('up').addEventListener('change',e=>{handle(e.target.files); e.target.value='';});
  function handle(files){ [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{ const url=URL.createObjectURL(f); const li=document.createElement('li'); li.innerHTML=`<img src="${url}" alt=""><div><b style="font-weight:500">${MN.A.esc(f.name)}</b><div class="progress" style="margin-top:6px"><span></span></div></div><span class="pct">0%</span>`; $('ul').appendChild(li);
      let p=0; const bar=li.querySelector('.progress span'), pct=li.querySelector('.pct'); const tm=setInterval(()=>{ p=Math.min(100,p+8+Math.random()*18); bar.style.width=p+'%'; pct.textContent=Math.round(p)+'%'; if(p>=100){ clearInterval(tm); pct.innerHTML=MN.A.badge('consent'); const id=Date.now()+Math.random(); items.unshift({f:f.name.replace(/\.[^.]+$/,''),cap:'',alt:'',cat:'community',consent:'consent',id,src:url}); active=id; draw(); setTimeout(()=>li.remove(),2500); MN.toast('Preview added','Add alt text and confirm consent before use','success'); } },180); }); }
  draw();
})();
</script><script src="../js/motion.js"></script>
</body>
</html>
