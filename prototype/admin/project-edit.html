<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit project · Admin · 2026 Cyber Bootcamp · Maxim Nyansa Foundation</title>
<meta name="description" content="Design prototype for the Maxim Nyansa Foundation 2026 Cybersecurity Bootcamp community website.">
<meta name="theme-color" content="#0E2A1E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2388CC00'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.4-8 10.4C11.4 23.4 8 20 8 15V9z' fill='none' stroke='%230E2A1E' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/admin.css">
</head>
<body data-root="../" data-page="" class="admin " data-admin="projects" data-crumbs="Projects>projects.html|Edit project">
<a class="skip-link" href="#main">Skip to content</a>
<div class="admin-shell"><aside id="admin-sidebar"></aside><div class="admin-body"><header id="admin-topbar"></header>
<main id="main" class="admin-main"><div class="a-head"><div><span class="a-sub" id="sub">Project</span><h1 id="h">Edit project</h1></div><div class="a-head__actions"><a class="btn btn--ghost btn--sm" id="pv" href="../project.html" target="_blank"><svg class="i i--sm"><use href="#i-eye"/></svg>Preview</a></div></div>
<form id="f" novalidate>
<div class="error-summary" role="alert"></div>
<div class="form-layout">
  <div class="form-stack">
    <section class="panel"><div class="panel__head"><h2>Overview</h2></div><div class="panel__body form-grid">
      <div class="field full"><label for="ti">Project title *</label><input class="input" id="ti" required maxlength="80" data-min="6" data-req="Give the project a title."></div>
      <div class="field"><label for="ty">Type *</label><select class="select" id="ty" required data-req="Choose a type."><option value="">Choose…</option><option>Lab</option><option>CTF</option><option>Case study</option><option>Community project</option><option>Capstone</option></select></div>
      <div class="field"><label for="mo">Module</label><select class="select" id="mo"></select></div>
      <div class="field full"><label for="ab">Abstract *</label><textarea class="textarea" id="ab" required maxlength="400" data-min="30" data-req="Write an abstract of at least 30 characters."></textarea></div>
      <div class="field full"><span class="field-label" id="tm-l">Team (trainee display names)</span><div class="tag-input" id="tm" aria-labelledby="tm-l"><input placeholder="Add a name and press Enter" aria-label="Add team member"></div></div>
      <div class="field"><label for="rp">Repository URL</label><input class="input" id="rp" type="url" placeholder="https://"></div>
      <div class="field"><label for="dm">Demo / write-up URL</label><input class="input" id="dm" type="url" placeholder="https://"></div>
    </div></section>
    <section class="panel"><div class="panel__head"><h2>Steps</h2><button class="btn btn--ghost btn--xs" type="button" id="add-step"><svg class="i i--sm"><use href="#i-plus"/></svg>Add step</button></div><div class="panel__body"><ul class="drag-list" id="steps"></ul></div></section>
  </div>
  <aside class="form-side">
    <section class="panel"><div class="panel__head"><h2>Review</h2><span id="rb"></span></div><div class="panel__body">
      <div class="field"><label for="rs">Status</label><select class="select" id="rs"><option value="draft">Draft</option><option value="review">In review</option><option value="published">Published</option></select></div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="safe"><span>Confirmed: lab-only, no real systems targeted</span></label>
      <label class="check" style="margin-top:8px"><input type="checkbox"><span>Team agreed to share publicly</span></label>
    </div></section>
    <section class="panel"><div class="panel__head"><h2>Cover</h2></div><div class="panel__body"><div class="img-field" id="cvw" style="aspect-ratio:16/10"></div></div></section>
    <button type="button" class="btn btn--ghost btn--sm" id="del" style="color:var(--danger);justify-content:center"><svg class="i i--sm"><use href="#i-trash"/></svg>Delete project</button>
  </aside>
</div>
<div class="savebar"><span class="status">All changes saved · prototype</span><a class="btn btn--ghost btn--sm" href="projects.html">Cancel</a><button class="btn btn--dark btn--sm" type="submit">Save project</button></div>
</form>
</main></div></div>
<script src="../js/data.js"></script><script src="../js/components.js"></script><script src="../js/admin.js"></script><script>
(function(){
  const $=id=>document.getElementById(id); const isNew=MN.q('new');
  $('mo').innerHTML=MN.MODULES.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  const p=isNew?null:(MN.PROJECTS.find(x=>x.id==+MN.q('id'))||MN.PROJECTS[0]);
  const last=document.querySelector('.crumbs li:last-child span');
  if(p){ $('ti').value=p.title; $('ty').value=p.type; $('mo').value=p.module; $('ab').value='Sample abstract: the problem, the lab setup, what the team found and what they recommend.'; $('h').textContent=p.title; $('sub').textContent=p.type+' · sample'; $('pv').href='../project.html?id='+p.id; last.textContent=p.title; $('rs').value=p.id<3?'review':'draft'; $('cvw').innerHTML=MN.cover(p.cover,''); }
  else { $('h').textContent='New project'; last.textContent='New project'; $('del').hidden=true; $('cvw').innerHTML=MN.cover('terminal',''); }
  const rb=()=>$('rb').innerHTML=MN.A.badge($('rs').value); $('rs').addEventListener('change',rb); rb();
  MN.A.tags($('tm'), p?['Sample Trainee 01','Sample Trainee 04']:[]);
  let steps=p?['Set up the isolated lab','Map the environment','Test and record findings','Write recommendations']:['First step'];
  const draw=()=>{ $('steps').innerHTML=steps.map((s,i)=>`<li class="drag-item" draggable="true" data-i="${i}"><button type="button" class="drag-handle" aria-label="Reorder step ${i+1}. Use arrow keys">${MN.icon('drag','i--sm')}</button><span class="yr">${String(i+1).padStart(2,'0')}</span><input class="input" value="${MN.A.esc(s)}" aria-label="Step ${i+1}" style="flex:1"><div class="actions"><button type="button" class="icon-btn" data-move="-1" aria-label="Move up"${i?'':' disabled'}><svg class="i i--sm" aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-chevron-down"/></svg></button><button type="button" class="icon-btn" data-move="1" aria-label="Move down"${i<steps.length-1?'':' disabled'}>${MN.icon('chevron-down','i--sm')}</button><button type="button" class="icon-btn danger" data-rm aria-label="Remove step ${i+1}">${MN.icon('x','i--sm')}</button></div></li>`).join(''); };
  const sync=()=>{ steps=[...$('steps').querySelectorAll('.drag-item input')].map(i=>i.value); };
  draw();
  const renum=()=>{ const li=[...$('steps').children]; li.forEach((l,i)=>{l.dataset.i=i; l.querySelector('.yr').textContent=String(i+1).padStart(2,'0'); l.querySelector('[data-move="-1"]').disabled=!i; l.querySelector('[data-move="1"]').disabled=i===li.length-1;}); sync(); };
  MN.A.dragList($('steps'),renum);
  $('steps').addEventListener('click',e=>{const b=e.target.closest('[data-rm]'); if(!b)return; sync(); steps.splice(+b.closest('.drag-item').dataset.i,1); draw(); MN.toast('Step removed');});
  $('add-step').addEventListener('click',()=>{sync(); steps.push(''); draw(); $('steps').lastElementChild.querySelector('input').focus();});
  MN.A.form($('f'),{savedMsg:'Project saved'});
  $('del').addEventListener('click',()=>MN.confirm({title:'Delete this project?',text:'This removes it from the public projects page. Prototype only.'}).then(ok=>{if(ok){MN.toast('Project deleted','Returning to the list…');setTimeout(()=>location.href='projects.html',900);}}));
})();
</script><script src="../js/motion.js"></script>
</body>
</html>
