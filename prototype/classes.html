<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class archive · 2026 Cyber Bootcamp · Maxim Nyansa Foundation</title>
<meta name="description" content="Every class of the 2026 Cybersecurity Bootcamp, filterable by module and status.">
<meta name="theme-color" content="#0E2A1E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2388CC00'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.4-8 10.4C11.4 23.4 8 20 8 15V9z' fill='none' stroke='%230E2A1E' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-root="" data-page="classes" data-header-tone="light">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main"><section class="page-hero" style="padding-bottom:var(--s-8)">
  <div class="container">
    <ol class="crumbs" data-reveal><li><a href="index.html">Home</a></li><li>Bootcamp</li><li aria-current="page">Classes</li></ol>
    <div class="split" style="align-items:end">
      <div class="split__a" style="grid-column:1 / span 7"><span class="eyebrow" data-reveal>Class archive</span><h1 class="h1" style="margin-top:20px" data-split>Every lesson,<br>in one place.</h1></div>
      <div class="split__b" style="grid-column:9 / span 4"><p class="lead" data-reveal>Notes, labs and resources are published after each class.</p><span class="ph" style="margin-top:16px" data-reveal>All lessons are samples</span></div>
    </div>
  </div>
</section>
<section class="section" style="padding-top:var(--s-7)">
  <div class="container">
    <div class="tabs" role="tablist" aria-label="Filter by module" id="mod-tabs" style="margin-bottom:24px"></div>
    <div class="toolbar">
      <div class="chips" role="group" aria-label="Filter by status" id="st-chips">
        <button class="chip" aria-pressed="true" data-s="all">All weeks</button>
        <button class="chip" aria-pressed="false" data-s="done">Completed</button>
        <button class="chip" aria-pressed="false" data-s="now">This week</button>
        <button class="chip" aria-pressed="false" data-s="upcoming">Upcoming</button>
      </div>
      <label class="select-wrap" style="margin-left:auto"><span class="sr-only">Sort</span>
        <select class="select" id="sort"><option value="asc">Oldest first</option><option value="desc">Newest first</option></select></label>
      <span class="result-count" id="count" aria-live="polite" style="margin-left:0"></span>
    </div>
    <div class="lesson-grid" id="grid"></div>
    <div class="empty" id="empty" hidden><div class="empty__art"><svg class="i i--lg"><use href="#i-search"/></svg></div><h3>No classes match</h3><p class="muted">Try another module or status.</p><button class="btn btn--ghost btn--sm" id="reset">Reset filters</button></div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script><script src="js/components.js"></script><script>
(function(){
  const pics=['hack-coding-team','electronics-lab','vr-demo-group','presenters-yellow-room','trio-google-neon','participant-phone','vr-headset-moment','arc-wall-trio','duo-google-wall','guests-seated','vr-group-lounge','selfie-orange-wall'];
  const tabs=document.getElementById('mod-tabs');
  tabs.innerHTML=`<button class="tab" role="tab" aria-selected="true" data-m="all">All modules</button>`+MN.MODULES.map(m=>`<button class="tab" role="tab" aria-selected="false" data-m="${m.id}">${m.short}</button>`).join('');
  const grid=document.getElementById('grid');
  const render=dir=>{const list=[...MN.CLASSES].sort((a,b)=>dir==='desc'?b.week-a.week:a.week-b.week);
    grid.innerHTML=list.map(c=>`<a class="card lesson-card" href="lesson.html?id=${c.id}" data-m="${c.module}" data-s="${c.status}">
      <div class="card__media" style="position:relative"><span class="wkbig">${String(c.week).padStart(2,'0')}</span><img src="${MN.img(pics[c.id-1],800)}" alt="" width="800" height="533" loading="lazy"></div>
      <div class="card__body"><div class="card__meta"><span class="tag">${MN.mod(c.module).short}</span><span class="st st--${c.status}">${c.status==='now'?'This week':c.status==='done'?'Completed':'Upcoming'}</span></div>
      <h3 class="card__title">${c.title}</h3><p class="muted" style="font-size:14px;margin-top:8px">w/c ${MN.fmt(c.date)} · ${c.format}</p></div>
      <div class="card__foot"><span class="ph">Sample lesson</span><span class="go">${MN.icon('arrow-right','i--sm')}</span></div></a>`).join(''); apply(); };
  let m='all', s='all';
  const apply=()=>{const n=MN.filterItems([...grid.children],el=>(m==='all'||el.dataset.m===m)&&(s==='all'||el.dataset.s===s),document.getElementById('empty')); document.getElementById('count').textContent=`${n} of ${MN.CLASSES.length} classes`;};
  MN.initTabs(); tabs.addEventListener('tabchange',e=>{m=e.detail.dataset.m;apply()});
  const chips=[...document.querySelectorAll('#st-chips .chip')];
  chips.forEach(c=>c.addEventListener('click',()=>{chips.forEach(x=>x.setAttribute('aria-pressed',x===c));s=c.dataset.s;apply()}));
  const q=MN.q('status'); if(q){const c=chips.find(x=>x.dataset.s===q); if(c) c.click();}
  document.getElementById('sort').addEventListener('change',e=>render(e.target.value));
  document.getElementById('reset').addEventListener('click',()=>{tabs.querySelector('[data-m="all"]').click();chips[0].click()});
  render('asc');
})();
</script><script src="js/motion.js"></script>
</body>
</html>
