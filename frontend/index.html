<script>
  (function () {
    var path = location.pathname;
    if (path === '/admin' || path.indexOf('/admin/') === 0) {
      var meta = document.createElement('meta');
      meta.name = 'robots';
      meta.content = 'noindex, nofollow';
      document.head.appendChild(meta);
    }
  })();
</script>
<style>
  html,body{margin:0;min-height:100%;background:#010905}
  #boot{
    position:fixed;inset:0;z-index:400;display:grid;justify-items:center;align-content:center;gap:18px;
    background:radial-gradient(120% 80% at 50% 40%,#01190c 0%,#010905 72%);
    color:#F6F7F2;text-align:center;font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  }
  #boot .msg{margin:0;font-size:15px;letter-spacing:.01em}
  #boot .track{width:min(420px,86vw);height:6px;border-radius:999px;background:rgba(246,247,242,.16);overflow:hidden}
  #boot .track span{display:block;width:18%;height:100%;background:#88CC00}
  #boot .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot" role="status" aria-live="polite" aria-busy="true">
  <p class="msg" aria-hidden="true">Securing the network...</p>
  <div class="track" aria-hidden="true"><span></span></div>
  <span class="sr">Loading the bootcamp…</span>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
